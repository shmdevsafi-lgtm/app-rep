name: Build APK Android

on:
  push:
    branches: [ main, main1.0, master, develop ]
  pull_request:
    branches: [ main, main1.0, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_OFFLINE_LOGIN_SALT: ${{ secrets.VITE_OFFLINE_LOGIN_SALT }}
          VITE_OFFLINE_LOGIN_HASH: ${{ secrets.VITE_OFFLINE_LOGIN_HASH }}
        run: |
          test -n "$VITE_OFFLINE_LOGIN_SALT" || (echo "Missing GitHub Actions Secret: VITE_OFFLINE_LOGIN_SALT." && exit 1)
          test -n "$VITE_OFFLINE_LOGIN_HASH" || (echo "Missing GitHub Actions Secret: VITE_OFFLINE_LOGIN_HASH." && exit 1)
          pnpm run build:client

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Setup Capacitor (dev deps)
        run: pnpm add -D @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android platform
        run: pnpm exec cap add android

      - name: Sync Capacitor
        run: pnpm exec cap sync

      - name: Build Android (debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
